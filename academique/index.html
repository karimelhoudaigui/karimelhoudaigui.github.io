<script>
(async () => {
  const token = location.hash.slice(1);
  if (!/^[A-Za-z0-9_-]{43}$/.test(token)) return;

  const status = document.getElementById("status");
  const bytes = (value) => Uint8Array.from(atob(value), (character) => character.charCodeAt(0));
  try {
    const key = await crypto.subtle.importKey(
      "raw", bytes(token.replaceAll("-", "+").replaceAll("_", "/") + "="),
      "AES-GCM", false, ["decrypt"]
    );
    const payload = bytes(document.getElementById("payload").textContent);
    const page = await crypto.subtle.decrypt(
      {name: "AES-GCM", iv: payload.slice(0, 12)}, key, payload.slice(12)
    );
    document.open();
    document.write(new TextDecoder().decode(page));
    document.close();
    document.addEventListener("click", (event) => {
      const link = event.target.closest('a[href^="#"]');
      if (!link || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      const target = document.getElementById(link.getAttribute("href").slice(1));
      if (!target) return;
      event.preventDefault();
      target.scrollIntoView();
    });
  } catch {
    status.textContent = "This access link is invalid.";
  }
})();
</script>
